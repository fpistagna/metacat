services:
  metacat:
    build:
      context: .
      dockerfile: ./docker/metacat/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/metacat?authSource=admin&replicaSet=rs0&directConnection=true"
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - ./src:/app/src # Monta il codice sorgente per lo sviluppo live
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    networks:
      - metacat-network

  mongodb:
    image: mongo:latest
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
    entrypoint: ["/bin/sh", "/usr/local/bin/metacat-mongo-entrypoint.sh"]
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./docker/mongodb/entrypoint.sh:/usr/local/bin/metacat-mongo-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost --port 27017 --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"quit(db.adminCommand('ping').ok ? 0 : 2)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - metacat-network

  mongodb-init:
    image: mongo:latest
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
    entrypoint: ["/bin/sh", "/usr/local/bin/init-replica-set.sh"]
    volumes:
      - ./docker/mongodb/init-replica-set.sh:/usr/local/bin/init-replica-set.sh:ro
    networks:
      - metacat-network

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/certs:/etc/nginx/certs # Montiamo la cartella dei certificati
      - ./public:/usr/share/nginx/html
    depends_on:
      - metacat
    networks:
      - metacat-network

volumes:
  mongo-data:
  mongo-config:

networks:
  metacat-network:
    driver: bridge
